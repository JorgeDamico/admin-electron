<section class="container-fluid px-3">
    <h4>Configuracion</h4>
    <div class="row">
        <div class="col col-6">
            <div class="row">
                <div class="col col-2"><h5>Productos:</h5></div>
                <div class="col col-1 d-flex align-items-center"><button type="button" class="btn btn-outline-success btn-sm py-0"
                    data-bs-toggle="modal" data-bs-target="#exampleModal" (click)="elegirItem('productos')">Nuevo</button></div>
            </div>
            <table class="table table-bordered table-striped">
                <thead class="table-bordered table-info">
                    <tr>
                        <th>Id</th>
                        <th>Producto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let producto of productos | paginate: { itemsPerPage: 4, currentPage: pageProductos, id: 'productos' }">
                        <td>{{ producto.id }}</td>
                        <td>{{ producto.producto }}</td>
                        <td><button type="button" class="btn btn-outline-danger btn-sm py-0" (click)="eliminarItem('productos', producto.id)">Eliminar</button></td>
                    </tr>
                </tbody>
            </table>
            <pagination-controls id="productos" (pageChange)="pageProductos = $event"></pagination-controls>
        </div>
        <div class="col col-6">
            <div class="row">
                <div class="col col-2"><h5>Marcas:</h5></div>
                <div class="col col-1 d-flex align-items-center"><button type="button" class="btn btn-outline-success btn-sm py-0"
                    data-bs-toggle="modal" data-bs-target="#exampleModal" (click)="elegirItem('marcas')">Nueva</button></div>
            </div>
            <table class="table table-bordered table-striped">
                <thead class="table-bordered table-info">
                    <tr>
                        <th>Id</th>
                        <th>Marca</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let marca of marcas | paginate: { itemsPerPage: 4, currentPage: pageMarcas, id: 'marcas' }">
                        <td>{{ marca.id }}</td>
                        <td>{{ marca.marca }}</td>
                        <td><button type="button" class="btn btn-outline-danger btn-sm py-0"  (click)="eliminarItem('marcas', marca.id)">Eliminar</button></td>
                    </tr>
                </tbody>
            </table>
            <pagination-controls id="marcas" (pageChange)="pageMarcas = $event"></pagination-controls>
        </div>
    </div>
    <div class="row" style="border-top: 0.2px solid lightgrey; padding-top: 10px;">
        <div class="col col-6">
            <div class="row">
                <div class="col col-2"><h5>Razones:</h5></div>
                <div class="col col-1 d-flex align-items-center"><button type="button" class="btn btn-outline-success btn-sm py-0"
                    data-bs-toggle="modal" data-bs-target="#exampleModal" (click)="elegirItem('razones')">Nueva</button></div>
            </div>
            <table class="table table-bordered table-striped">
                <thead class="table-bordered table-info">
                    <tr>
                        <th>Id</th>
                        <th>Razon</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let razon of razones | paginate: { itemsPerPage: 4, currentPage: pageRazones, id: 'razones' }">
                        <td>{{ razon.id }}</td>
                        <td>{{ razon.razon }}</td>
                        <td><button type="button" class="btn btn-outline-danger btn-sm py-0" (click)="eliminarItem('razones', razon.id)">Eliminar</button></td>
                    </tr>
                </tbody>
            </table>
            <pagination-controls id="razones" (pageChange)="pageRazones = $event"></pagination-controls>
        </div>
        <div class="col col-6">
            
        </div>
    </div>
</section>

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Agregar  {{ item | titlecase }}</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="formulario">
          <div class="mb-3">
            <label for="nombre" class="col-form-label">Nombre:</label>
            <input type="text" class="form-control" id="nombre" formControlName="nombre">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-primary" (click)="crearItem(item)" [disabled]="formulario.invalid">Guardar</button>
      </div>
    </div>
  </div>
</div>
