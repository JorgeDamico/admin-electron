<section class="container-fluid px-3">
    <h4>{{ title }}</h4>

    <form [formGroup]="formulario">
        <div class="row mb-3">
            <div class="col col-2">
                <label for="razon">Razón:</label>
                <ng-select [items]="razones"
                  bindLabel="razon"
                  bindValue="razon"
                  formControlName="razon"
                  [searchable]="true"
                  placeholder="Razon"
                ></ng-select>
            </div>
            <div class="col col-2">
                <label for="anio">Fecha:</label>
                <input type="date" id="fecha" formControlName="fecha" class="form-control"/>
            </div>
            <div class="col col-2 d-flex align-items-end" style="justify-content: center;">
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" (click)="limpiarModal()"
                    data-bs-target="#exampleModal" [disabled]="formulario.invalid">Agregar</button>
            </div>
            <div class="col col-1 d-flex align-items-end" style="justify-content: center;">
                <button class="btn btn-secondary" (click)="cancelarGasto()">Cancelar</button>
            </div>
            <div class="col col-2 d-flex align-items-end" style="justify-content: center;">
                <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#confirmModal"
                  [disabled]="formulario.invalid || productosSeleccionados.length < 1">Finalizar</button>
            </div>
        </div>
    </form>

    <table class="table table-bordered table-striped">
        <thead class="table-bordered table-info">
            <tr>
                <th>Producto</th>
                <th>Marca</th>
                <th>Cantidad</th>
                <th>Valor Unitario</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let productoSeleccionado of productosSeleccionados | paginate: { itemsPerPage: 10, currentPage: page }">
                <td>{{ productoSeleccionado.nombre }}</td>
                <td>{{ productoSeleccionado.marca }}</td>
                <td>{{ productoSeleccionado.cantidad }}</td>
                <td>{{ productoSeleccionado.valorUnitario }}</td>
                <td><button type="button" class="btn btn-outline-danger btn-sm py-0" (click)="eliminarSeleccion(productoSeleccionado)">Eliminar</button></td>
            </tr>
        </tbody>
    </table>
    <pagination-controls (pageChange)="page = $event"></pagination-controls>

</section>

<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalLabel">Confirmar Gasto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        ¿Estás seguro de guardar este gasto?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="cargarGasto" (click)="cargarGasto()" data-bs-dismiss="modal">Confirmar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Agregar Producto</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="formularioModal">
          <div class="mb-3">
            <label for="productos" class="col-form-label">Productos:</label>
            <ng-select [items]="productos"
              bindLabel="producto"
              bindValue="producto"
              formControlName="producto"
              [searchable]="true"
              placeholder="Producto"
            ></ng-select>
          </div>
          <div class="mb-3">
            <label for="marcas" class="col-form-label">Marcas:</label>
            <ng-select [items]="marcas"
              bindLabel="marca"
              bindValue="marca"
              formControlName="marca"
              [searchable]="true"
              placeholder="Marca"
            ></ng-select>
          </div>
          <div class="mb-3">
            <label for="cantidad" class="col-form-label">Cantidad:</label>
            <input type="number" class="form-control" id="cantidad" formControlName="cantidad">
          </div>
          <div class="mb-3">
            <label for="valorUnitario" class="col-form-label">Valor Unitario:</label>
            <input type="number" class="form-control" id="valorUnitario" formControlName="valorUnitario" step="any">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-primary" (click)="agregarProducto()" [disabled]="formularioModal.invalid">Guardar</button>
      </div>
    </div>
  </div>
</div>
